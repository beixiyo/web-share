name: 发布部署包

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 产物版本，例如 v1.0.0 或 v1.0.0-beta.1
        required: true
        default: v1.0.0
      targets:
        description: 逗号分隔的目标平台，默认构建全部六种组合
        required: false
        default: linux-amd64,linux-arm64,darwin-amd64,darwin-arm64,windows-amd64,windows-arm64

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出发布版本
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 安装 pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.7.1

      - name: 安装 Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm

      - name: 安装 Go 最新补丁版本
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache-dependency-path: packages/server-go/go.sum

      - name: 安装固定版本依赖
        run: pnpm install --frozen-lockfile

      - name: 检查 Windows 启动脚本语法
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/release-template/start.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }

      - name: 构建和打包
        env:
          RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
          RELEASE_TARGETS: ${{ inputs.targets || 'linux-amd64,linux-arm64,darwin-amd64,darwin-arm64,windows-amd64,windows-arm64' }}
        run: pnpm release:build --version "$RELEASE_VERSION" --targets "$RELEASE_TARGETS"

      - name: 保存构建产物供验收
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-share-${{ github.event_name == 'push' && github.ref_name || inputs.version }}
          path: release/*/*
          if-no-files-found: error
          compression-level: 0

      - name: 创建 Release 并上传附件
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_VERSION" > /dev/null; then
            gh release upload "$RELEASE_VERSION" release/"$RELEASE_VERSION"/* --clobber
          else
            flags=(--verify-tag --generate-notes)
            if [[ "$RELEASE_VERSION" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$RELEASE_VERSION" release/"$RELEASE_VERSION"/* "${flags[@]}"
          fi
