# 使用 HTTPS 时：先建目录并放入证书，例如：
#   mkdir -p certs && cp /path/to/fullchain.pem certs/cert.pem && cp /path/to/privkey.pem certs/key.pem
# 然后取消下方 volumes 与 SSL_* 环境变量的注释，并可将端口改为 "443:3001"

services:
  web-share:
    container_name: web-share
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_SERVER_URL="wss://YourHost:YourPort"
    ports:
      - "443:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001

      - CLEAR_TIME=300000
      - DISCONNECT_DELAY=300000
      - ROOM_EMPTY_GRACE_MS=300000
      - DEFAULT_ROOM_CODE=442385

      # HTTPS 证书路径（与下方 volume 挂载目标一致：挂载到 /app/certs）
      - SSL_KEY_PATH=/app/certs/beixiyo.dpdns.key
      - SSL_CERT_PATH=/app/certs/beixiyo.dpdns.pem
    volumes:
      # 宿主机证书目录 → 容器内 /app/certs（与 SSL_*_PATH 的 ./certs 对应）
      - /home/certs:/app/certs
    networks:
      - net
    restart: unless-stopped

networks:
  net:
